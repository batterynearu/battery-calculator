<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battery Near U - Calculator</title>
    <style>
        :root { --primary: #ffc107; --dark: #1e1e1e; --light: #ffffff; --grey: #2a2a2a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--dark); color: var(--light); padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; background: var(--grey); padding: 25px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); border-top: 5px solid var(--primary); }
        h2 { text-align: center; margin-bottom: 20px; color: var(--primary); font-size: 24px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #bbb; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #121212; color: #fff; font-size: 16px; outline: none; }
        input:focus, select:focus { border-color: var(--primary); }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--primary); color: var(--dark); font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #e0a800; }
        .link-btn { text-align: center; margin-top: 15px; font-size: 14px; color: var(--primary); cursor: pointer; }
        .page { display: none; }
        .active-page { display: block; }
        .loader { display: none; text-align: center; margin: 15px 0; color: var(--primary); font-weight: bold; }
        .result-box { margin-top: 20px; padding: 15px; background: #121212; border-radius: 8px; border-left: 4px solid var(--primary); display: none; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 16px; }
        .result-item span:last-child { font-weight: bold; color: var(--primary); }
        .logout-btn { background: #dc3545; color: white; margin-top: 20px; }
        .logout-btn:hover { background: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <!-- Loader -->
    <div id="loader" class="loader">⚙️ Processing... Please wait...</div>

    <!-- LOGIN PAGE -->
    <div id="loginPage" class="page active-page">
        <h2>Retailer Login</h2>
        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="loginMobile" placeholder="Enter Registered Number">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter Password">
        </div>
        <button onclick="handleLogin()">Login</button>
        <div class="link-btn" onclick="switchPage('registerPage')">New Retailer? Register Here</div>
    </div>

    <!-- REGISTER PAGE -->
    <div id="registerPage" class="page">
        <h2>Retailer Registration</h2>
        <div class="form-group">
            <label>Full Name / Shop Name</label>
            <input type="text" id="regName" placeholder="Enter Name">
        </div>
        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="regMobile" placeholder="Enter Mobile Number">
        </div>
        <div class="form-group">
            <label>Set Password</label>
            <input type="password" id="regPassword" placeholder="Create Password">
        </div>
        <button onclick="handleRegister()">Register</button>
        <div class="link-btn" onclick="switchPage('loginPage')">Already Registered? Login</div>
    </div>

    <!-- DASHBOARD PAGE -->
    <div id="dashboardPage" class="page">
        <h2>Battery Weight Calculator</h2>
        <div class="form-group">
            <label>Select Battery Model</label>
            <select id="batterySelect" onchange="calculateWeight()">
                <option value="">-- Choose Model --</option>
            </select>
        </div>
        <div class="form-group">
            <label>Quantity (Pcs)</label>
            <input type="number" id="quantityInput" value="1" min="1" oninput="calculateWeight()">
        </div>

        <div id="resultBox" class="result-box">
            <div class="result-item"><span>Single Weight:</span> <span id="singleWeight">0 kg</span></div>
            <div class="result-item"><span>Total Quantity:</span> <span id="totalQty">0</span></div>
            <div class="result-item" style="border-top: 1px solid #333; padding-top: 8px; margin-top: 8px;">
                <span>Total Weight:</span> <span id="totalWeight" style="font-size: 20px;">0 kg</span>
            </div>
        </div>

        <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
</div>

<script>
    // 🔴 APNA WEB APP URL YAHAN BHI RECHECK KAR LIJIYEGA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_9b5wKExZ_Y_YgYg7gJ_p3F_mR18V5M2RCH3_YmI/exec"; 

    // Generate unique Device ID or get existing
    let deviceId = localStorage.getItem("device_id");
    if (!deviceId) {
        deviceId = "DEV-" + Math.random().toString(36).substring(2, 11).toUpperCase();
        localStorage.setItem("device_id", deviceId);
    }

    let batteryDatabase = [];

    // 🔄 APP START: Check if user is already logged in permanently
    window.onload = function() {
        const savedMobile = localStorage.getItem("rem_mobile");
        const savedPassword = localStorage.getItem("rem_password");

        if (savedMobile && savedPassword) {
            showLoader(true);
            // Auto-login hit
            apiCall({ action: "login", mobile: savedMobile, password: savedPassword, deviceId: deviceId }, function(response) {
                showLoader(false);
                if (response.status === "success") {
                    batteryDatabase = response.batteries || [];
                    populateDropdown();
                    switchPage('dashboardPage');
                } else {
                    // Agar backend se active state hat gayi ho toh storage clear karein
                    localStorage.removeItem("rem_mobile");
                    localStorage.removeItem("rem_password");
                    alert("Session expired or account deactivated. Please login again.");
                }
            });
        }
    };

    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pageId).classList.add('active-page');
    }

    function showLoader(show) {
        document.getElementById("loader").style.display = show ? "block" : "none";
    }

    function apiCall(params, callbackName) {
        const callbackId = "cb_" + Math.random().toString(36).substring(2, 9);
        window[callbackId] = function(data) {
            callbackName(data);
            delete window[callbackId];
            document.getElementById(callbackId).remove();
        };

        let url = SCRIPT_URL + "?callback=" + callbackId;
        for (let key in params) {
            url += "&" + key + "=" + encodeURIComponent(params[key]);
        }

        const script = document.createElement("script");
        script.id = callbackId;
        script.src = url;
        document.body.appendChild(script);
    }

    function handleRegister() {
        const name = document.getElementById("regName").value.trim();
        const mobile = document.getElementById("regMobile").value.trim();
        const password = document.getElementById("regPassword").value.trim();

        if(!name || !mobile || !password) { alert("Please fill all details!"); return; }

        showLoader(true);
        apiCall({ action: "register", name: name, mobile: mobile, password: password, deviceId: deviceId }, function(response) {
            showLoader(false);
            if (response.status === "success") {
                alert("Registration Successful! Please wait for Admin approval (Active status).");
                switchPage('loginPage');
            } else if (response.status === "exists") {
                alert("This mobile number is already registered!");
            } else {
                alert("Registration failed. Try again.");
            }
        });
    }

    function handleLogin() {
        const mobile = document.getElementById("loginMobile").value.trim();
        const password = document.getElementById("loginPassword").value.trim();

        if(!mobile || !password) { alert("Please enter mobile and password!"); return; }

        showLoader(true);
        apiCall({ action: "login", mobile: mobile, password: password, deviceId: deviceId }, function(response) {
            showLoader(false);
            if (response.status === "success") {
                // 💾 LOGIN SUCCESS: Save credentials permanently in phone memory
                localStorage.setItem("rem_mobile", mobile);
                localStorage.setItem("rem_password", password);

                batteryDatabase = response.batteries || [];
                populateDropdown();
                switchPage('dashboardPage');
            } else if (response.status === "pending") {
                alert("Your account is pending approval from Admin!");
            } else if (response.status === "wrong_device") {
                alert("This number is registered on another device!");
            } else {
                alert("Invalid Mobile Number or Password!");
            }
        });
    }

    function populateDropdown() {
        const select = document.getElementById("batterySelect");
        select.innerHTML = '<option value="">-- Choose Model --</option>';
        batteryDatabase.forEach(b => {
            let opt = document.createElement("option");
            opt.value = b.model;
            opt.textContent = b.model;
            select.appendChild(opt);
        });
    }

    function calculateWeight() {
        const model = document.getElementById("batterySelect").value;
        const qty = parseInt(document.getElementById("quantityInput").value) || 1;
        const resultBox = document.getElementById("resultBox");

        if (!model) { resultBox.style.display = "none"; return; }

        const item = batteryDatabase.find(b => b.model === model);
        if (item) {
            const singleW = item.weight;
            const totalW = singleW * qty;

            document.getElementById("singleWeight").textContent = singleW.toFixed(2) + " kg";
            document.getElementById("totalQty").textContent = qty;
            document.getElementById("totalWeight").textContent = totalW.toFixed(2) + " kg";
            resultBox.style.display = "block";
        }
    }

    function handleLogout() {
        if(confirm("Are you sure you want to logout?")) {
            // 🧹 Clear permanent memory
            localStorage.removeItem("rem_mobile");
            localStorage.removeItem("rem_password");
            window.location.reload();
        }
    }
</script>
</body>
</html>
