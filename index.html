<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battery Business Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <div id="authContainer" class="bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-700">
        <h2 id="authTitle" class="text-2xl font-bold text-center mb-1">Retailer Login</h2>
        <p id="authSubtitle" class="text-xs text-gray-400 text-center mb-6">Enter your details to access the calculator</p>

        <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
            <div id="nameField" class="hidden">
                <label class="block text-sm font-medium text-gray-400 mb-1">Your Name:</label>
                <input type="text" id="regName" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 text-white" placeholder="Enter your full name">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Mobile Number:</label>
                <input type="number" id="phone" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 text-white" placeholder="Enter 10 digit number">
            </div>

            <div>
                <label id="passwordLabel" class="block text-sm font-medium text-gray-400 mb-1">Enter Password:</label>
                <input type="password" id="password" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 text-white" placeholder="Enter password">
            </div>

            <button type="submit" id="authBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors mt-2">
                Login
            </button>
        </form>

        <p class="text-sm text-center text-gray-400 mt-4">
            <span id="toggleQuestion">New user?</span> 
            <a href="#" onclick="toggleAuthMode()" id="toggleText" class="text-blue-500 hover:underline ml-1">Create Account</a>
        </p>
    </div>

    <div id="calculatorContainer" class="hidden bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-2xl border border-gray-700">
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <div>
                <h2 class="text-2xl font-bold text-emerald-400">Battery Business Calculator</h2>
                <p class="text-xs text-gray-400">Secure Partner Dashboard - batterynearu.com</p>
            </div>
            <button onclick="location.reload()" class="bg-red-600/20 hover:bg-red-600/40 text-red-400 text-xs px-3 py-1.5 rounded-lg border border-red-500/30 transition-colors">
                Logout
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div class="relative">
                <label class="block text-sm font-medium text-gray-400 mb-1">Search & Select Battery:</label>
                <input type="text" id="batterySearch" oninput="filterBatteries()" onfocus="filterBatteries()" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-emerald-500 text-white" placeholder="Type model to search..." autocomplete="off">
                
                <div id="searchDropdown" class="absolute left-0 right-0 mt-1 bg-gray-700 border border-gray-600 rounded-lg max-h-48 overflow-y-auto hidden z-50 shadow-2xl">
                    </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Selected Model Weight (Kg):</label>
                <input type="text" id="batteryWeight" readonly class="w-full px-4 py-2 bg-gray-600 border border-gray-600 rounded-lg text-gray-300 focus:outline-none" placeholder="Automatic weight">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Scrap Rate per Kg (Rs.):</label>
                <input type="number" id="ratePerKg" value="90" oninput="calculateAll()" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-emerald-500 text-white" placeholder="Enter scrap rate">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Scrap Battery Price (Calculated):</label>
                <input type="text" id="scrapPrice" readonly class="w-full px-4 py-2 bg-gray-600 border border-gray-600 rounded-lg text-amber-400 font-bold focus:outline-none" placeholder="Weight × Rate">
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-400 mb-1">Dealer Price / New Battery DP (Rs.):</label>
            <input type="number" id="dealerPrice" oninput="calculateAll()" class="w-full px-4 py-2 bg-gray-700 border border-emerald-500 rounded-lg focus:outline-none text-white text-lg font-semibold" placeholder="Enter Dealer Price (DP)">
        </div>

        <div class="bg-gradient-to-br from-gray-900 to-emerald-950 text-white p-6 rounded-2xl shadow-xl border border-emerald-500/20">
            <p class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Final Settlement Cost</p>
            <div class="flex justify-between items-baseline mt-2">
                <h3 class="text-xl text-gray-200 font-semibold">Net Landing Price:</h3>
                <span class="text-4xl font-black text-emerald-400">Rs. <span id="finalLandingPriceDisplay">0.00</span></span>
            </div>
            <p class="text-[10px] text-gray-400 mt-2 italic text-right">*Formula: Dealer Price (DP) - Scrap Price</p>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxaXKvpYfbhJB7gqwdXsUOQnignLYxr75CYqvpM4_wAgeaQhgDDsWGGLNmYOekbno6Dw/exec";

        // 🟢 AB DATA SHEET SE AUTOMATIC LOAD HOGA (KHALI ARRAY RAKHA HAI)
        let batteryDatabase = []; 
        let isLoginMode = true;

        function getDeviceId() {
            let info = window.navigator.userAgent + window.screen.height + window.screen.width;
            let hash = 0;
            for (let i = 0; i < info.length; i++) {
                hash = (hash << 5) - hash + info.charCodeAt(i);
                hash |= 0;
            }
            return "DEV-" + Math.abs(hash % 100000);
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');
            const nameField = document.getElementById('nameField');
            const passwordLabel = document.getElementById('passwordLabel');
            const authBtn = document.getElementById('authBtn');
            const toggleQuestion = document.getElementById('toggleQuestion');
            const toggleText = document.getElementById('toggleText');

            if (isLoginMode) {
                title.innerText = "Retailer Login";
                subtitle.innerText = "Enter your details to access the calculator";
                nameField.classList.add('hidden');
                passwordLabel.innerText = "Enter Password:";
                authBtn.innerText = "Login";
                toggleQuestion.innerText = "New user?";
                toggleText.innerText = "Create Account";
            } else {
                title.innerText = "Create Account";
                subtitle.innerText = "Register your mobile number to get access";
                nameField.classList.remove('hidden');
                passwordLabel.innerText = "Create Password:";
                authBtn.innerText = "Register";
                toggleQuestion.innerText = "Already registered?";
                toggleText.innerText = "Login Now";
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            const mobile = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('regName').value;
            const authBtn = document.getElementById('authBtn');

            if (mobile.length < 10) {
                alert("Please enter a valid 10-digit mobile number.");
                return;
            }

            const deviceId = getDeviceId();
            const action = isLoginMode ? "login" : "register";
            
            authBtn.innerText = "Processing... Please wait...";
            authBtn.disabled = true;

            const callbackName = 'jsonp_' + Math.round(100000 * Math.random());
            window[callbackName] = function(res) {
                authBtn.innerText = isLoginMode ? "Login" : "Register";
                authBtn.disabled = false;
                
                document.body.removeChild(script);
                delete window[callbackName];

                if (!isLoginMode) {
                    if (res.status === "exists") {
                        alert("Error: This mobile number is already registered!");
                    } else if (res.status === "success") {
                        alert("Registration Successful! Please open Google Sheet, change Status from 'Pending' to 'Active' to Login.");
                        toggleAuthMode();
                    }
                } else {
                    if (res.status === "success") {
                        alert("Login Successful!");
                        // 🟢 YAHAN SHEET SE AAYA HUA REAL DATA DATABASE MEIN CHALA GAYA
                        batteryDatabase = res.batteries || [];
                        
                        document.getElementById('authContainer').classList.add('hidden');
                        document.getElementById('calculatorContainer').classList.remove('hidden');
                        setupSearchOptions(); 
                    } else if (res.status === "pending") {
                        alert("Your account is currently pending approval. Please contact the administrator.");
                    } else if (res.status === "wrong_device") {
                        alert("Security Error: This account is already registered on another device!");
                    } else {
                        alert("Invalid Mobile Number or Password! Please try again.");
                    }
                }
            };

            const script = document.createElement('script');
            script.src = `${SCRIPT_URL}?action=${action}&mobile=${mobile}&password=${encodeURIComponent(password)}&name=${encodeURIComponent(name)}&deviceId=${deviceId}&callback=${callbackName}`;
            document.body.appendChild(script);
        }

        // --- ADVANCED SEARCH & FILTER LOGIC ---
        function setupSearchOptions() {
            const dropdown = document.getElementById('searchDropdown');
            dropdown.innerHTML = "";
            batteryDatabase.forEach(item => {
                const div = document.createElement('div');
                div.className = "px-4 py-2 hover:bg-emerald-600 cursor-pointer text-sm border-b border-gray-600/50 transition-colors";
                
                div.innerText = item.model; 
                
                div.onclick = function() {
                    document.getElementById('batterySearch').value = item.model;
                    document.getElementById('batteryWeight').value = item.weight; 
                    dropdown.classList.add('hidden');
                    calculateAll();
                };
                dropdown.appendChild(div);
            });
        }

        function filterBatteries() {
            const input = document.getElementById('batterySearch').value.toLowerCase();
            const dropdown = document.getElementById('searchDropdown');
            const items = dropdown.getElementsByTagName('div');
            
            dropdown.classList.remove('hidden');

            if(!input) {
                setupSearchOptions();
                return;
            }

            let hasResults = false;
            for (let i = 0; i < items.length; i++) {
                let txtValue = items[i].textContent || items[i].innerText;
                if (txtValue.toLowerCase().indexOf(input) > -1) {
                    items[i].style.display = "";
                    hasResults = true;
                } else {
                    items[i].style.display = "none";
                }
            }
            if(!hasResults) dropdown.classList.add('hidden');
        }

        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('searchDropdown');
            const searchInput = document.getElementById('batterySearch');
            if (e.target !== dropdown && e.target !== searchInput) {
                dropdown.classList.add('hidden');
            }
        });

        // --- BUSINESS CALCULATION LOGIC ---
        function calculateAll() {
            const weight = parseFloat(document.getElementById('batteryWeight').value) || 0;
            const scrapRate = parseFloat(document.getElementById('ratePerKg').value) || 0;
            const dealerPrice = parseFloat(document.getElementById('dealerPrice').value) || 0;
            
            const scrapCalculated = weight * scrapRate;
            document.getElementById('scrapPrice').value = "Rs. " + scrapCalculated.toFixed(2);

            let finalLandingPrice = dealerPrice - scrapCalculated;
            if(finalLandingPrice < 0) finalLandingPrice = 0;

            document.getElementById('finalLandingPriceDisplay').innerText = finalLandingPrice.toFixed(2);
        }
    </script>
</body>
</html>
